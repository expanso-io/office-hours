# Live feed: stack traces arrive over TCP one line at a time.
# A new event starts only where a line begins with an ISO timestamp.
input:
  socket_server:
    network: tcp
    address: "127.0.0.1:${PORT}"
    scanner:
      re_match:
        pattern: '(?m)^\d{4}-\d{2}-\d{2}T'
        max_buffer_size: 65536
pipeline:
  processors:
    - mapping: |
        root.message = content().string().trim()
        root.line_count = content().string().trim().split("\n").length()
        root.input_format = "timestamp-delimited-stacktrace"
output:
  broker:
    pattern: fan_out
    outputs:
      - file:
          path: "${OUTPUT_FILE}"
          codec: lines
      - stdout:
          codec: lines
