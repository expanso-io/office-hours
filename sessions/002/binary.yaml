input:
  file:
    paths: ["${FEED_FILE}"]
    scanner:
      decompress:
        algorithm: gzip
        into:
          lines: {}
pipeline:
  processors:
    - mapping: |
        root = content().parse_json()
        root.input_format = "gzip-jsonl"
output:
  file:
    path: "${OUTPUT_FILE}"
    codec: lines
