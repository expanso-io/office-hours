name: demo-which-site-broke
namespace: default
type: pipeline
labels: {demo: which-site-broke, variant: baseline}
selector:
  match_labels: {demo: which-site-broke, role: turbine}
config:
  input:
    http_server: {address: "0.0.0.0:8080", path: /ingest, allowed_verbs: [POST], timeout: 5s}
  pipeline: {threads: 1, processors: []}
  output:
    http_client:
      url: ${DEMO_SINK_URL:http://host.docker.internal:19450/api/sink/events}
      verb: POST
      headers: {X-Demo-Transport-Origin: "${DEMO_NODE_ID:unknown}"}
      timeout: 2s
      retry_period: 250ms
      max_retry_backoff: 2s
      retries: 3
      max_in_flight: 1
