    environment: {DEMO_SINK_URL: "http://demo-api:8000/api/sink/events", DEMO_NODE_ID: edge-04, DEMO_SITE_ID: wind-west, DEMO_ASSET_ID: turbine-04, DEMO_REGION: us-west, DEMO_APP_VERSION: 2.4.1}
