[project]
name = "office-hours-005-tiny-models"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.3",
  "scikit-learn>=1.7",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
