name: office-hours-005-models
namespace: default
type: pipeline
description: One stream of pump records, three tiny models, each one called a different way.
labels:
  session: "005"
  stage: "2-ollama"
selector:
  match_labels:
    role: office-hours
config:
  # Records are made on the node: one pump reading plus the operator's note,
  # every OH5_INTERVAL, stopping after 90 records so a run is always capped.
  input:
    generate:
      count: 90
      interval: ${OH5_INTERVAL:2s}
      mapping: |
        let n = counter()
        let kind = ["routine", "routine", "routine", "routine", "routine", "routine", "routine", "routine", "routine", "routine", "gearbox", "gearbox", "electrical", "leak", "thermal", "thermal", "belt", "smoke", "bearing", "bearing"].index(random_int(seed: 5001, min: 0, max: 19))
        let notes = {
          "routine": ["Routine walkdown, all readings normal.", "Shift handover, nothing to report.", "Visual check done, no issues found."],
          "gearbox": ["Loud grinding noise from the gearbox, vibration climbing.", "Gearbox rattling under load, getting worse."],
          "electrical": ["Breaker tripped twice this shift, motor smells burnt.", "Motor drawing high current, cable warm to the touch."],
          "leak": ["Oil puddle under the pump seal, topped up reservoir.", "Slow drip from the pump seal, placed a tray under it."],
          "thermal": ["Housing too hot to touch, coolant fan not spinning.", "Cooling fan stopped, casing temperature climbing."],
          "belt": ["Belt squeal at startup, went away after warm-up."],
          "smoke": ["Smoke from the control cabinet, isolated the line."],
          "bearing": ["Bearing on the drive end running warm, greased it.", "Drive end bearing rumbling, needs a look."]
        }
        let shift = {
          "routine": [0, 0, 0], "gearbox": [3, 6.5, 1], "electrical": [9, 0.8, 9], "leak": [0, 0, 0],
          "thermal": [19, 0.5, 1.5], "belt": [1, 2.2, 1], "smoke": [12, 1, 6], "bearing": [7, 3, 0.5]
        }
        let pool = $notes.get($kind)
        let off = $shift.get($kind)
        root.id = "r-%04d".format($n)
        root.ts = now()
        root.asset = ["pump-01", "pump-02", "pump-03", "pump-04"].index(random_int(seed: 5002, min: 0, max: 3))
        root.temp_c = ((62 + $off.index(0) + (random_int(seed: 5003, min: 0, max: 600) - 300) / 100) * 10).round() / 10
        root.vibration_mm_s = ((2.8 + $off.index(1) + (random_int(seed: 5004, min: 0, max: 120) - 60) / 100) * 100).round() / 100
        root.current_a = ((18 + $off.index(2) + (random_int(seed: 5005, min: 0, max: 300) - 150) / 100) * 10).round() / 10
        root.note = $pool.index(random_int(seed: 5006, min: 0, max: 99) % $pool.length())

  pipeline:
    # One thread: one record at a time, so each model gets exactly one call in
    # flight and the timings are not shared with a neighbour.
    threads: 1
    processors:
      # 1. Python. A long-lived scikit-learn process fed one JSON line per
      #    record over stdin; it answers with one JSON line on stdout.
      - mutation: meta python_t0 = timestamp_unix_nano()
      - branch:
          request_map: |
            root.temp_c = this.temp_c
            root.vibration_mm_s = this.vibration_mm_s
            root.current_a = this.current_a
          processors:
            - subprocess:
                name: ${OH5_UV:uv}
                args: [run, --project, "${OH5_DEMO_DIR}", --frozen, --quiet, python, "${OH5_DEMO_DIR}/scorer/score.py"]
                codec_send: lines
                codec_recv: lines
          result_map: |
            root.python = this
            root.python.call_ms = ((timestamp_unix_nano() - metadata("python_t0")) / 1000).round() / 1000
      - catch:
          - mutation: |
              root.python = {"error": error()}

      # 2. Ollama. The native ollama_chat processor asks a local Ollama server
      #    to rate the operator's note, in JSON mode.
      - mutation: meta ollama_t0 = timestamp_unix_nano()
      - branch:
          request_map: root = this.note
          processors:
            - ollama_chat:
                server_address: ${OLLAMA_URL:http://127.0.0.1:18434}
                model: ${OLLAMA_MODEL:qwen2.5:0.5b}
                system_prompt: >-
                  You triage factory maintenance notes. Reply with JSON:
                  {"severity": "low"} or {"severity": "medium"} or {"severity": "high"}.
                  high: smoke, burning, breaker trips, overheating. medium: noise, leaks,
                  wear. low: routine, nothing wrong.
                prompt: 'Maintenance note: "${! content() }"'
                response_format: json
                temperature: 0
                max_tokens: 32
          result_map: |
            root.ollama = content().string().parse_json().catch({"unparsed": content().string()})
            root.ollama.call_ms = ((timestamp_unix_nano() - metadata("ollama_t0")) / 1000).round() / 1000
      - catch:
          - mutation: |
              root.ollama = {"error": error()}

      - mutation: root.done_at = now()

  # One JSON object per line, appended as each record finishes.
  output:
    file:
      path: ${OH5_OUTPUT_FILE}
      codec: lines
